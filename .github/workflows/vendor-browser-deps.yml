name: Vendor browser dependencies

on:
  push:
    paths:
      - ".github/workflows/vendor-browser-deps.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned browser libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/pdfjs vendor/xlsx
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js \
            -o vendor/pdfjs/pdf.min.js
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js \
            -o vendor/pdfjs/pdf.worker.min.js
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js \
            -o vendor/xlsx/xlsx.full.min.js
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/LICENSE \
            -o vendor/pdfjs/LICENSE
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/xlsx@0.18.5/LICENSE \
            -o vendor/xlsx/LICENSE
      - name: Commit vendored libraries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Vendor browser PDF and XLSX dependencies"
          git push
