name: Update index 1.3beta

on:
  push:
    paths:
      - '.github/workflows/update-index-13.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<meta name="app-version" content="20260809-1">',
              '<meta name="app-version" content="1.3beta">',
              1,
          )

          qnt = '<script src="https://cdn.jsdelivr.net/gh/yulcaribe/gbeyan@main/gendec%2Fqnt.js"></script>'
          sxs = '<script src="https://cdn.jsdelivr.net/gh/yulcaribe/gbeyan@main/gendec/sxs.js?v=20260622-5"></script>'

          if qnt not in text:
              if sxs not in text:
                  raise SystemExit('SXS dependency line not found in index.html')
              text = text.replace(sxs, qnt + '\n' + sxs, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit 1.3beta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/update-index-13.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "1.3beta"
          git push
