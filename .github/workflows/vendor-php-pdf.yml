name: Vendor PHP PDF parser

on:
  push:
    paths:
      - "api-php/composer.json"
      - ".github/workflows/vendor-php-pdf.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: iconv, zlib, mbstring
          tools: composer:v2
      - name: Install production dependencies
        run: composer install --working-dir=api-php --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Commit lockfile and vendored dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-php/composer.lock api-php/vendor
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vendor PHP PDF parser"
          git push
