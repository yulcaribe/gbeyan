name: Update index 1.3.1beta

on:
  push:
    paths:
      - '.github/workflows/update-index-131.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Dosyanın en başında görünür sürüm notu.
          text = re.sub(r'^<!-- VERSION: .*? -->\s*\n?', '', text, count=1)
          text = '<!-- VERSION: 1.3.1beta -->\n' + text

          # Uygulama sürümü.
          text, n = re.subn(
              r'<meta name="app-version" content="[^"]*">',
              '<meta name="app-version" content="1.3.1beta">',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('app-version meta tag not found')

          # CSS her zaman jsDelivr üzerinden çekilsin.
          text, n = re.subn(
              r'<link rel="stylesheet" href="[^"]*style\.css[^"]*">',
              '<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/yulcaribe/gbeyan@main/style.css">',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('style.css link not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit 1.3.1beta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/update-index-131.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "1.3.1beta"
          git push
