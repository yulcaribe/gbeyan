name: Update UI 1.3.2beta

on:
  push:
    paths:
      - '.github/workflows/update-index-style-132.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and style
        run: python .github/scripts/patch132.py
      - name: Commit 1.3.2beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git rm -f .github/workflows/update-index-style-132.yml .github/scripts/patch132.py
          git commit -m "1.3.2beta"
          git push
