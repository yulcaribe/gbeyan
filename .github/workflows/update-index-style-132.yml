name: Update UI 1.3.2beta

on:
  push:
    paths:
      - '.github/workflows/update-index-style-132.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index and style
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<!-- VERSION: 1.3.1beta -->', '<!-- VERSION: 1.3.2beta -->', 1)
          s = s.replace('<meta name="app-version" content="1.3.1beta">', '<meta name="app-version" content="1.3.2beta">', 1)
          s = s.replace('<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/yulcaribe/gbeyan@main/style.css">', '<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/yulcaribe/gbeyan@main/style.css?v=1.3.2beta">', 1)

          old = '      <input type="search" class="search-input" id="searchInput"\n        placeholder="Uçuş, REG veya meydan ara" oninput="onSearch(this.value)" disabled>\n    </div>\n\n    <div class="filter-panel is-disabled" id="flightFilters" aria-disabled="true">'
          new = '      <input type="search" class="search-input" id="searchInput"\n        placeholder="Uçuş, REG veya meydan ara" oninput="onSearch(this.value)" disabled>\n\n      <div class="filter-panel is-disabled" id="flightFilters" aria-disabled="true">'
          if old not in s:
              raise SystemExit('toolbar/filter start not found')
          s = s.replace(old, new, 1)

          old = '      <div class="filter-summary" id="filterSummary">CSV yüklendikten sonra filtreler aktif olacak.</div>\n    </div>\n\n    <!-- Table -->'
          new = '        <div class="filter-summary" id="filterSummary">CSV yüklendikten sonra filtreler aktif olacak.</div>\n      </div>\n    </div>\n\n    <!-- Table -->'
          if old not in s:
              raise SystemExit('toolbar/filter end not found')
          s = s.replace(old, new, 1)
          s = s.replace('<label for="processFilter">Süreç Durumu</label>', '<label for="processFilter">Süreç</label>', 1)
          s = s.replace('        Filtreleri Temizle\n', '        Temizle\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          lines = s.splitlines()
          if lines and lines[0].startswith('/* TGS HGSB UI styles | version:'):
              lines[0] = '/* TGS HGSB UI styles | version: 1.3.2beta */'
              s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
          else:
              s = '/* TGS HGSB UI styles | version: 1.3.2beta */\n' + s

          marker = '/* ── 1.3.2beta: filters integrated into toolbar ── */'
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + '\n'

          override = """
    /* ── 1.3.2beta: filters integrated into toolbar ── */
    .search-input {
      margin-left: auto;
      width: 210px;
      min-height: 34px;
    }

    .toolbar .filter-panel {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transition: none;
    }

    .toolbar .filter-panel.is-disabled {
      background: transparent;
      border-color: transparent;
    }

    .toolbar .filter-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .toolbar .filter-group-wide { min-width: 0; }

    .toolbar .filter-group label {
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
    }

    .toolbar .filter-group select {
      min-height: 34px;
      height: 34px;
      padding: 6px 28px 6px 9px;
      border-radius: 6px;
      font-size: 12px;
    }

    #directionFilter { width: 88px; }
    #comparisonFilter { width: 118px; }
    #processFilter { width: 150px; }

    .toolbar .filter-reset-btn {
      min-height: 34px;
      height: 34px;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .toolbar .filter-summary {
      min-height: 34px;
      margin-left: 0;
      gap: 4px 8px;
      color: #64748b;
      font-size: 11px;
      white-space: nowrap;
    }

    .toolbar .filter-summary strong { font-size: 12px; }
    .toolbar .filter-summary span { padding-left: 7px; }
    .toolbar .filter-panel.is-disabled .filter-summary { display: none; }

    @media (max-width: 1250px) {
      .search-input { margin-left: 0; }
      .toolbar .filter-panel { flex: 1 1 100%; }
    }

    @media (max-width: 720px) {
      .toolbar { align-items: stretch; }
      .search-input { width: 100%; }
      .toolbar .filter-panel { width: 100%; align-items: stretch; }
      .toolbar .filter-group { flex: 1 1 145px; }
      .toolbar .filter-group select { width: 100% !important; }
      .toolbar .filter-summary { flex: 1 1 100%; white-space: normal; }
    }
          """
          p.write_text(s.rstrip() + '\n\n' + override.strip() + '\n', encoding='utf-8')
          PY

      - name: Commit 1.3.2beta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git rm -f .github/workflows/update-index-style-132.yml || true
          git commit -m "1.3.2beta"
          git push
