name: PHP lint

on:
  push:
    paths:
      - 'api-php/**'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'api-php/**'
      - '.github/workflows/php-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, dom, mbstring
      - name: Lint PHP files
        run: find api-php -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l
